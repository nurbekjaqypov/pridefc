<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админка — PRIDE FC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03110a">
<link rel="icon" type="image/png" href="icons/admin-favicon.png">
<link rel="apple-touch-icon" href="icons/admin-180.png">
<link rel="manifest" href="admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PFC Админ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<style>
  .nav { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .nav button { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
  .nav button.on { background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; box-shadow: var(--glow); }
  @media (hover: hover) { .nav button:hover:not(.on) { color: var(--text); border-color: rgba(62,224,122,.45); box-shadow: var(--glow-soft); } }
  .nav .badge { background: var(--warn); color: #000; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 6px; font-weight: 800; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
  .stat { position: relative; overflow: hidden; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06); }
  .stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, rgba(62,224,122,.22), transparent 70%); }
  @media (hover: hover) { .stat:hover { transform: translateY(-2px); border-color: rgba(62,224,122,.4); box-shadow: var(--glow-soft); } }
  .stat div { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
  .stat b { display: block; font-size: 24px; font-weight: 800; margin-top: 4px; }
  .stat small { color: var(--muted); font-size: 12px; }
  .meter { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 12px var(--accent); transition: width .6s var(--ease); }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding: 6px 2px 0; }
  .chart .c { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .chart .c i { width: 100%; max-width: 26px; min-height: 3px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent), rgba(24,168,79,.35)); box-shadow: 0 0 12px rgba(62,224,122,.35); transition: height .6s var(--ease); }
  .chart .c.z i { background: rgba(255,255,255,.08); box-shadow: none; }
  .chart .c span { font-size: 10px; color: var(--muted); }
  .grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  table.sched { border-collapse: collapse; width: 100%; min-width: 520px; }
  .sched th, .sched td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 0; vertical-align: top; }
  .sched th { background: rgba(3,17,10,.75); backdrop-filter: blur(10px); padding: 12px 10px; font-size: 13px; text-align: left; position: sticky; top: 0; z-index: 1; }
  .sched td.h { width: 64px; padding: 12px 8px; color: var(--muted); font-size: 13px; font-weight: 600; border-left: 0; font-variant-numeric: tabular-nums; }
  .sched tr:hover td.h { color: var(--accent); }
  .cell { width: 100%; height: 100%; min-height: 48px; display: block; border: 0; background: none; text-align: left; padding: 9px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .cell:hover { background: rgba(62,224,122,.08); color: var(--text); box-shadow: inset 0 0 0 1px rgba(62,224,122,.35); }
  .cell.free::before { content: "+ "; color: var(--accent); font-weight: 800; }
  .bk { height: 100%; margin: 3px; padding: 8px 10px; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--muted); background: rgba(255,255,255,.05); font-size: 13px; }
  @media (hover: hover) { .bk:hover { transform: translateY(-1px); box-shadow: var(--glow-soft); } }
  .bk b { display: block; }
  .bk.paid { border-left-color: var(--accent); background: rgba(62,224,122,.12); }
  .bk.unpaid { border-left-color: #a9bdb0; }
  .bk.hold { border-left-color: var(--warn); background: rgba(255,194,74,.1); }
  .bk.claimed { border-left-color: var(--info); background: rgba(94,194,255,.1); }
  .bk.prelim { border-left-color: var(--accent); border-left-style: dashed; background: rgba(62,224,122,.07); }
  .cell s { opacity: .6; }
  .cell i { font-style: normal; color: #ff8a6a; font-weight: 700; }
  .rc img { max-width: 100%; border-radius: 12px; margin-top: 10px; }
  .past td { opacity: .5; }
  .list .item { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); border-radius: 10px; }
  .list .item:hover { background: rgba(255,255,255,.03); }
  .list .item:last-child { border-bottom: 0; }
  .star { background: none; border: 0; font-size: 20px; cursor: pointer; color: #4c6555; transition: transform .2s var(--ease), color .2s; }
  .star:hover { transform: scale(1.2); }
  .star.on { color: var(--warn); text-shadow: 0 0 12px rgba(255,194,74,.6); }
  table.fields { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.fields th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; }
  table.fields td { padding: 4px; }
  table.fields input { width: 100%; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--text); font-size: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .hrs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .hrs button { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); cursor: pointer; font-size: 13px; }
  .hrs button.on { background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; box-shadow: var(--glow-soft); }
  .hrs button:disabled { opacity: .3; cursor: not-allowed; }
  .top .brand h1 { font-size: 18px; }
  .fin-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-top: 14px; align-items: start; }
  .fin-stats { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .fin-stats .stat b { font-size: 22px; white-space: nowrap; }
  .chart .c { min-width: 0; position: relative; }
  .chart .c span { overflow: hidden; max-width: 100%; }
  .chart .c em { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: rgba(3,17,10,.9); padding: 1px 5px; border-radius: 5px; pointer-events: none; z-index: 2; }
  .fin-grid .card h2 { margin-bottom: 12px; }
  .chart.tall { height: 150px; }
  .chart .c em { font-style: normal; font-size: 10px; color: var(--text); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .chart.tall { padding-top: 18px; }
  .chart .c:hover em { opacity: 1; }
  .chart .c:hover i { filter: brightness(1.25); box-shadow: 0 0 18px rgba(62,224,122,.6); }
  .hb { margin-bottom: 12px; }
  .hb .t { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; }
  .hb .t span { color: var(--muted); }
  .hb .meter { height: 8px; margin-top: 0; }
  .delta { font-size: 12px; font-weight: 700; margin-left: 6px; }
  .delta.up { color: var(--accent); } .delta.down { color: var(--danger); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chips button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; transition: all .25s var(--ease); }
  .chips button.on { background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; box-shadow: var(--glow-soft); }
  .chips input { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--text); font-size: 13px; }
  table.top { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.top th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; font-size: 12px; }
  table.top td { padding: 8px 4px; border-top: 1px solid var(--line); }
  table.top td.n, table.top th.n { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .fin-grid { grid-template-columns: 1fr; } .fin-stats { grid-template-columns: 1fr 1fr; gap: 8px; } .fin-stats .stat { padding: 12px; } .fin-stats .stat b { font-size: 17px; } .fin-stats .stat small { font-size: 11px; } .delta { display: block; margin: 2px 0 0; } }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } .stat b { font-size: 20px; } }
</style>
</head>
<body>
<div id="demo"></div>
<header class="top"><div class="wrap">
  <div class="brand">
    <div class="logo">PFC</div>
    <div class="grow"><h1 id="title">PRIDE FC</h1><p>Админ-панель</p></div>
    <button class="btn small" id="logout" hidden>Выйти</button>
  </div>
  <div class="nav" id="nav" hidden>
    <button data-v="sched" class="on">Расписание</button>
    <button data-v="finance">Финансы</button>
    <button data-v="pending">Сверка оплат<span class="badge" id="pc" hidden></span></button>
    <button data-v="discounts">Скидки</button>
    <button data-v="clients">Клиенты</button>
    <button data-v="settings">Настройки</button>
  </div>
</div></header>
<main class="wrap" id="app"><p class="empty">Загрузка…</p></main>
<div id="modal"></div>

<script type="module">
import { call, isDemo, saveLocal, loadLocal, dropLocal } from "./api.js";
import { addDays, weekday, hourLabel, rangeLabel, money, priceInfo, dayKey, slotStart, normPhone } from "./core.js";

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const dateLong = (d) => `${+d.slice(8)} ${MON[+d.slice(5, 7) - 1]}, ${WD[weekday(d)]}`;
const STATUS = { hold: "Ждёт оплаты", prelim: "Чек прикреплён — сверить с Kaspi", claimed: "Ждёт проверки", paid: "Предоплата получена", unpaid: "Без предоплаты", cancelled: "Отменена", done: "Завершена" };
const SRC = { site: "сайт", admin: "админ" };

let pass = loadLocal("pass");
let cfg, loc = loadLocal("aloc"), view = "sched", date = dayKey(Date.now()), bookings = [], clients = [];

const api = (m, p, o = {}) => call(m, p, { ...o, admin: pass });
function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " err" : "");
  t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3000);
}
const closeModal = () => ($("#modal").innerHTML = "");
function modal(html) {
  $("#modal").innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  $(".modal-bg").onclick = (e) => { if (e.target.classList.contains("modal-bg")) closeModal(); };
}
const waLink = (p) => "https://wa.me/" + String(p).replace(/\D/g, "");
const clientOf = (phone) => clients.find((c) => c.phone === phone);

async function start() {
  if (await isDemo()) $("#demo").innerHTML = '<div class="demo">Демо-режим: данные только в этом браузере. Пароль: demo · <a href="index.html">Страница клиента →</a></div>';
  if (!pass) return loginView();
  try { await api("GET", "/admin/check"); } catch { dropLocal("pass"); pass = null; return loginView(); }
  cfg = await api("GET", "/admin/config");
  if (!cfg.locations.some((l) => l.id === loc)) loc = cfg.locations[0].id;
  $("#title").innerHTML = esc(cfg.name).replace(/^(.*?)(\s+)(\S+)$/, "$1$2<em>$3</em>");
  $("#nav").hidden = false; $("#logout").hidden = false;
  $("#logout").onclick = () => { dropLocal("pass"); location.reload(); };
  $$("#nav button").forEach((b) => b.onclick = () => { view = b.dataset.v; $$("#nav button").forEach((x) => x.classList.toggle("on", x === b)); route(); });
  await loadClients();
  route();
  setInterval(() => { if (!$("#modal").innerHTML) refreshPending(); if (view === "sched" && !$("#modal").innerHTML) loadSched(true); }, 20000);
}

function loginView() {
  $("#app").innerHTML = `<form class="card" id="lf" style="max-width:360px;margin:40px auto">
    <h3 style="margin-top:0">Вход для администратора</h3>
    <label class="f">Пароль<input type="password" name="p" required autofocus></label>
    <button class="btn main block">Войти</button></form>`;
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    pass = new FormData(e.target).get("p");
    try { await api("GET", "/admin/check"); saveLocal("pass", pass); start(); }
    catch (err) { toast(err.status === 401 ? "Неверный пароль" : err.message, true); }
  };
}

function route() {
  refreshPending();
  if (view === "sched") return loadSched();
  if (view === "pending") return pendingView();
  if (view === "clients") return clientsView();
  if (view === "settings") return settingsView();
  if (view === "discounts") return discountsView();
  if (view === "finance") return financeView();
}

async function loadClients() { clients = (await api("GET", "/admin/clients")).clients; }

async function refreshPending() {
  try {
    const { bookings: p } = await api("GET", "/admin/pending");
    const n = p.filter((b) => b.status !== "hold").length;
    $("#pc").hidden = !p.length; $("#pc").textContent = n ? `${n}!` : p.length;
    return p;
  } catch { return []; }
}

// ---------- Расписание ----------
async function loadSched(silent) {
  if (!silent) $("#app").innerHTML = '<p class="empty">Загрузка…</p>';
  bookings = (await api("GET", "/admin/day", { query: { date } })).bookings;
  schedView();
}

const locName = (id) => cfg.locations.find((l) => l.id === id)?.name || "";
function schedView() {
  const fields = cfg.fields.filter((f) => f.active !== false && f.locationId === loc);
  const ids = new Set(fields.map((f) => f.id));
  const act = bookings.filter((b) => b.live && ids.has(b.fieldId));
  const hoursSold = act.reduce((s, b) => s + b.hours.length, 0);
  const totalHours = fields.length * (cfg.close - cfg.open);
  const revenue = act.reduce((s, b) => s + b.total, 0);
  const prepaid = act.filter((b) => b.status === "paid").reduce((s, b) => s + b.prepay, 0);
  const onCheck = act.filter((b) => b.status === "prelim").reduce((s, b) => s + b.prepay, 0);

  let hourly = "";
  for (let h = cfg.open; h < cfg.close; h++) {
    const n = act.filter((b) => b.hours.includes(h)).length;
    const pct = fields.length ? Math.round((n / fields.length) * 100) : 0;
    hourly += `<div class="c ${n ? "" : "z"}" title="${hourLabel(h)} — занято ${n} из ${fields.length}"><i style="height:${Math.max(pct, 4)}%"></i><span>${h % 24}</span></div>`;
  }
  const at = {}; // fieldId -> hour -> booking
  for (const b of act) for (const h of b.hours) (at[b.fieldId] ||= {})[h] = b;
  const skip = {};
  let rows = "";
  for (let h = cfg.open; h < cfg.close; h++) {
    const past = slotStart(date, h + 1) <= Date.now();
    rows += `<tr class="${past ? "past" : ""}"><td class="h">${hourLabel(h)}</td>`;
    for (const f of fields) {
      if (skip[f.id + ":" + h]) continue;
      const b = at[f.id]?.[h];
      if (b) {
        let span = 1;
        while (at[f.id]?.[h + span] === b) { skip[f.id + ":" + (h + span)] = 1; span++; }
        const reg = b.regular || clientOf(b.phone)?.regular;
        rows += `<td rowspan="${span}"><div class="bk ${b.status}" data-id="${b.id}">
          <b>${reg ? "★ " : ""}${esc(b.name)}</b>
          <span class="muted">${esc(b.phone || "")}</span><br>
          <span class="muted">${rangeLabel(b.hours)} · ${money(b.total)}</span><br>
          <span class="pill ${b.status}" style="margin-top:4px">${STATUS[b.status]}</span>
        </div></td>`;
      } else {
        const pi = priceInfo(cfg, f, date, h);
        rows += `<td><button class="cell free" data-f="${f.id}" data-h="${h}">${pi.pct ? `<s>${money(pi.base)}</s> ${money(pi.price)} <i>−${pi.pct}%</i>` : money(pi.price)}</button></td>`;
      }
    }
    rows += "</tr>";
  }

  $("#app").innerHTML = `
    ${cfg.locations.length > 1 ? `<div class="nav" style="margin-top:18px">${cfg.locations.map((l) => `<button class="${l.id === loc ? "on" : ""}" data-loc="${l.id}">📍 ${esc(l.name)}</button>`).join("")}</div>` : ""}
    <div class="row wrap" style="margin-top:14px">
      <button class="btn small" id="prev">‹</button>
      <input type="date" class="inp" id="dp" value="${date}" style="width:auto;margin:0">
      <button class="btn small" id="next">›</button>
      <button class="btn small" id="today">Сегодня</button>
      <div class="grow"></div>
      <b>${dateLong(date)}</b>
    </div>
    <div class="stats">
      <div class="stat"><div>Брони</div><b>${act.length}</b><small>${act.filter((b) => b.source === "site").length} с сайта · ${act.filter((b) => b.source === "admin").length} вручную</small></div>
      <div class="stat"><div>Загрузка</div><b>${totalHours ? Math.round((hoursSold / totalHours) * 100) : 0}%</b><div class="meter"><i style="width:${totalHours ? Math.round((hoursSold / totalHours) * 100) : 0}%"></i></div><small>${hoursSold} из ${totalHours} ч</small></div>
      <div class="stat"><div>Выручка дня</div><b>${money(revenue)}</b><small>по всем броням</small></div>
      <div class="stat"><div>Предоплаты</div><b>${money(prepaid)}</b><small>${onCheck ? `+ ${money(onCheck)} на сверке` : "сверено"}</small></div>
    </div>
    ${fields.length ? `<div class="card" style="margin-bottom:14px;padding:14px 16px"><h2 style="margin-bottom:6px">Загрузка по часам</h2><div class="chart">${hourly}</div></div>` : ""}
    <div class="grid-wrap"><table class="sched">
      <thead><tr><th></th>${fields.map((f) => `<th>${esc(f.name)}<div class="muted" style="font-weight:400;font-size:11px">${esc(f.note || "")}</div></th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${!fields.length ? '<p class="empty">На этом адресе нет включённых полей — добавьте в Настройках</p>' : ""}
    ${bookings.some((b) => !b.live && ids.has(b.fieldId)) ? `<h2>Отменённые / просроченные</h2><div class="card list">${bookings.filter((b) => !b.live && ids.has(b.fieldId)).map((b) => `
      <div class="item"><div class="grow"><b>${esc(b.name)}</b> <span class="muted">${esc(b.phone)} · ${esc(b.fieldName)} · ${rangeLabel(b.hours)}</span></div>
      <span class="pill ${b.expired ? "expired" : "cancelled"}">${b.expired ? "Не оплатил вовремя" : "Отменена"}</span>
      <button class="btn small" data-id="${b.id}">Открыть</button></div>`).join("")}</div>` : ""}`;

  $$("[data-loc]").forEach((b) => b.onclick = () => { loc = b.dataset.loc; saveLocal("aloc", loc); schedView(); });
  $("#prev").onclick = () => { date = addDays(date, -1); loadSched(); };
  $("#next").onclick = () => { date = addDays(date, 1); loadSched(); };
  $("#today").onclick = () => { date = dayKey(Date.now()); loadSched(); };
  $("#dp").onchange = (e) => { if (e.target.value) { date = e.target.value; loadSched(); } };
  $$(".cell.free").forEach((c) => c.onclick = () => bookForm(c.dataset.f, +c.dataset.h));
  $$("[data-id]").forEach((c) => c.onclick = () => bookingCard(bookings.find((b) => b.id === c.dataset.id)));
}

function bookForm(fieldId, h0) {
  const fields = cfg.fields.filter((f) => f.active !== false && f.locationId === loc);
  const busy = (fid) => new Set(bookings.filter((b) => b.live && b.fieldId === fid).flatMap((b) => b.hours));
  let fid = fieldId, hrs = new Set([h0]);
  const draw = () => {
    const f = fields.find((x) => x.id === fid);
    const bz = busy(fid);
    const auto = [...hrs].reduce((s, h) => s + priceInfo(cfg, f, date, h).price, 0);
    $("#hrs").innerHTML = Array.from({ length: cfg.close - cfg.open }, (_, i) => cfg.open + i)
      .map((h) => `<button type="button" data-h="${h}" class="${hrs.has(h) ? "on" : ""}" ${bz.has(h) ? "disabled" : ""}>${hourLabel(h)}</button>`).join("");
    $$("#hrs button").forEach((b) => b.onclick = () => { const h = +b.dataset.h; hrs.has(h) ? hrs.delete(h) : hrs.add(h); draw(); });

// подтверждение без системных диалогов: первый клик — «точно?», второй — действие
function confirmInline(btn) {
  if (btn.dataset.sure) return true;
  btn.dataset.sure = "1"; btn.dataset.txt = btn.textContent; btn.textContent = "Нажмите ещё раз для подтверждения";
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.sure; btn.textContent = btn.dataset.txt; } }, 3000);
  return false;
}

// ---------- Финансы ----------
const fin = { preset: "month", from: "", to: "", loc: "all" };
function finRange() {
  const t = dayKey(Date.now());
  const m0 = t.slice(0, 8) + "01";
  if (fin.preset === "7") return [addDays(t, -6), t];
  if (fin.preset === "30") return [addDays(t, -29), t];
  if (fin.preset === "month") return [m0, addDays(addDays(m0, 32).slice(0, 8) + "01", -1)];
  if (fin.preset === "prev") { const p0 = addDays(m0, -1).slice(0, 8) + "01"; return [p0, addDays(m0, -1)]; }
  return [fin.from || addDays(t, -29), fin.to || t];
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

function finStats(bs, from, to) {
  const fields = cfg.fields.filter((f) => fin.loc === "all" || f.locationId === fin.loc);
  const ids = new Set(fields.map((f) => f.id));
  const inLoc = bs.filter((b) => ids.has(b.fieldId));
  const live = inLoc.filter((b) => b.live);
  const days = Math.round((Date.parse(to) - Date.parse(from)) / 864e5) + 1;
  const hours = sum(live, (b) => b.hours.length);
  const cap = days * fields.filter((f) => f.active !== false).length * (cfg.close - cfg.open);
  return {
    fields, live, cancelled: inLoc.filter((b) => b.status === "cancelled"), days,
    revenue: sum(live, (b) => b.total), hours, cap, load: pct(hours, cap),
    prepaid: sum(live.filter((b) => b.status === "paid"), (b) => b.prepay),
    onCheck: sum(live.filter((b) => b.status === "prelim"), (b) => b.prepay),
    disc: sum(live, (b) => Math.max(0, (b.fullTotal || b.total) - b.total)),
  };
}

async function financeView() {
  const [from, to] = finRange();
  const len = Math.round((Date.parse(to) - Date.parse(from)) / 864e5) + 1;
  const pFrom = addDays(from, -len), pTo = addDays(from, -1);
  $("#app").innerHTML = '<p class="empty">Считаем…</p>';
  let cur, prev;
  try {
    [cur, prev] = await Promise.all([
      api("GET", "/admin/range", { query: { from, to } }),
      api("GET", "/admin/range", { query: { from: pFrom, to: pTo } }).catch(() => ({ bookings: [] })),
    ]);
  } catch (e) { $("#app").innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
  const S = finStats(cur.bookings, from, to), P = finStats(prev.bookings, pFrom, pTo);
  const today = dayKey(Date.now());
  const played = S.live.filter((b) => b.date < today), ahead = S.live.filter((b) => b.date >= today);
  const avg = S.live.length ? S.revenue / S.live.length : 0, pAvg = P.live.length ? P.revenue / P.live.length : 0;
  const d = (a, b) => { if (!b) return ""; const v = Math.round(((a - b) / b) * 100); return `<span class="delta ${v >= 0 ? "up" : "down"}">${v >= 0 ? "▲" : "▼"} ${Math.abs(v)}%</span>`; };
  const fmtD = (x) => `${+x.slice(8)} ${MON[+x.slice(5, 7) - 1]}`;

  // по дням
  const byDay = {};
  for (let i = 0; i < S.days; i++) byDay[addDays(from, i)] = 0;
  S.live.forEach((b) => (byDay[b.date] += b.total));
  const maxDay = Math.max(1, ...Object.values(byDay));
  const step = S.days <= 14 ? 1 : S.days <= 31 ? 3 : 7;
  const dayBars = Object.entries(byDay).map(([k, v], i) => `<div class="c ${v ? "" : "z"}" title="${fmtD(k)} — ${money(v)}"><em>${v ? Math.round(v / 1000) + "k" : ""}</em><i style="height:${Math.max(pct(v, maxDay), 3)}%"></i><span>${i % step === 0 ? +k.slice(8) : ""}</span></div>`).join("");
  // по дням недели
  const WDN = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"], wdRev = [0, 0, 0, 0, 0, 0, 0], wdCnt = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 0; i < S.days; i++) wdCnt[(weekday(addDays(from, i)) + 6) % 7]++;
  S.live.forEach((b) => (wdRev[(weekday(b.date) + 6) % 7] += b.total));
  const wdAvg = wdRev.map((v, i) => (wdCnt[i] ? v / wdCnt[i] : 0)), maxWd = Math.max(1, ...wdAvg);
  const wdBars = wdAvg.map((v, i) => `<div class="c ${v ? "" : "z"}" title="${WDN[i]} — в среднем ${money(v)} в день"><em>${Math.round(v / 1000)}k</em><i style="height:${Math.max(pct(v, maxWd), 3)}%"></i><span>${WDN[i]}</span></div>`).join("");
  // по часам
  const hrCnt = {};
  for (let h = cfg.open; h < cfg.close; h++) hrCnt[h] = 0;
  S.live.forEach((b) => b.hours.forEach((h) => (hrCnt[h] = (hrCnt[h] || 0) + 1)));
  const hrCap = S.days * S.fields.length || 1;
  const hrBars = Object.entries(hrCnt).map(([h, n]) => `<div class="c ${n ? "" : "z"}" title="${hourLabel(+h)} — загрузка ${pct(n, hrCap)}%"><em>${pct(n, hrCap)}%</em><i style="height:${Math.max(pct(n, hrCap), 3)}%"></i><span>${+h % 24}</span></div>`).join("");
  // разрезы
  const hbars = (rows) => { const mx = Math.max(1, ...rows.map((r) => r.v)); return rows.map((r) => `<div class="hb"><div class="t"><b>${esc(r.name)}</b><span>${money(r.v)} · ${pct(r.v, S.revenue)}%${r.sub ? " · " + r.sub : ""}</span></div><div class="meter"><i style="width:${pct(r.v, mx)}%"></i></div></div>`).join("") || '<p class="muted">Нет данных</p>'; };
  const byLoc = cfg.locations.map((l) => { const x = S.live.filter((b) => cfg.fields.find((f) => f.id === b.fieldId)?.locationId === l.id); return { name: l.name, v: sum(x, (b) => b.total), sub: `${sum(x, (b) => b.hours.length)} ч` }; }).filter((r) => fin.loc === "all" || r.v);
  const byField = S.fields.map((f) => { const x = S.live.filter((b) => b.fieldId === f.id); const hh = sum(x, (b) => b.hours.length); return { name: `${locName(f.locationId)} · ${f.name}`, v: sum(x, (b) => b.total), sub: `загрузка ${pct(hh, S.days * (cfg.close - cfg.open))}%` }; });
  const bySrc = [["site", "Сайт"], ["admin", "Вручную (админ)"]].map(([k, n]) => { const x = S.live.filter((b) => b.source === k); return { name: n, v: sum(x, (b) => b.total), sub: `${x.length} броней` }; });
  // клиенты
  const cl = {};
  S.live.forEach((b) => { const k = b.phone || b.name; (cl[k] ||= { name: b.name, phone: b.phone, n: 0, h: 0, v: 0 }); cl[k].n++; cl[k].h += b.hours.length; cl[k].v += b.total; });
  const clients_ = Object.values(cl).sort((a, b) => b.v - a.v);
  const returning = clients_.filter((c) => c.n > 1).length;

  $("#app").innerHTML = `
    <div class="card" style="margin-top:16px;padding:14px 16px">
      <div class="chips">
        ${[["7", "7 дней"], ["30", "30 дней"], ["month", "Этот месяц"], ["prev", "Прошлый месяц"], ["custom", "Период"]].map(([k, n]) => `<button data-p="${k}" class="${fin.preset === k ? "on" : ""}">${n}</button>`).join("")}
        ${fin.preset === "custom" ? `<input type="date" id="ff" value="${from}"> — <input type="date" id="ft" value="${to}">` : ""}
      </div>
      ${cfg.locations.length > 1 ? `<div class="chips" style="margin-top:10px">${[["all", "Все адреса"], ...cfg.locations.map((l) => [l.id, "📍 " + l.name])].map(([k, n]) => `<button data-l="${k}" class="${fin.loc === k ? "on" : ""}">${esc(n)}</button>`).join("")}</div>` : ""}
      <p class="muted" style="font-size:12px;margin:10px 0 0">${fmtD(from)} — ${fmtD(to)} · ${S.days} дн. · сравнение с ${fmtD(pFrom)} — ${fmtD(pTo)}</p>
    </div>
    <div class="stats fin-stats">
      <div class="stat"><div>Выручка</div><b>${money(S.revenue)}${d(S.revenue, P.revenue)}</b><small>сыграно ${money(sum(played, (b) => b.total))} · впереди ${money(sum(ahead, (b) => b.total))}</small></div>
      <div class="stat"><div>Брони</div><b>${S.live.length}${d(S.live.length, P.live.length)}</b><small>${S.hours} ч продано</small></div>
      <div class="stat"><div>Загрузка</div><b>${S.load}%${d(S.load, P.load)}</b><div class="meter"><i style="width:${S.load}%"></i></div><small>${S.hours} из ${S.cap} ч</small></div>
      <div class="stat"><div>Средний чек</div><b>${money(avg)}${d(avg, pAvg)}</b><small>час в среднем ${money(S.hours ? S.revenue / S.hours : 0)}</small></div>
      <div class="stat"><div>Предоплаты</div><b>${money(S.prepaid)}</b><small>${S.onCheck ? `+ ${money(S.onCheck)} на сверке · ` : ""}на месте ${money(S.revenue - S.prepaid - S.onCheck)}</small></div>
      <div class="stat"><div>Скидки</div><b>${money(S.disc)}</b><small>${pct(S.disc, S.revenue + S.disc)}% от суммы по прайсу</small></div>
      <div class="stat"><div>Отмены</div><b>${S.cancelled.length}</b><small>упущено ${money(sum(S.cancelled, (b) => b.total))}</small></div>
      <div class="stat"><div>Клиенты</div><b>${clients_.length}</b><small>вернулись повторно ${returning} · ${pct(returning, clients_.length)}%</small></div>
    </div>
    <div class="card" style="padding:14px 16px"><h2>Выручка по дням</h2><div class="chart tall">${dayBars}</div></div>
    <div class="fin-grid">
      <div class="card"><h2>Средняя выручка по дням недели</h2><div class="chart tall">${wdBars}</div></div>
      <div class="card"><h2>Загрузка по часам</h2><div class="chart tall">${hrBars}</div></div>
      ${cfg.locations.length > 1 && fin.loc === "all" ? `<div class="card"><h2>По адресам</h2>${hbars(byLoc)}</div>` : ""}
      <div class="card"><h2>По полям</h2>${hbars(byField)}</div>
      <div class="card"><h2>Откуда брони</h2>${hbars(bySrc)}</div>
      <div class="card"><h2>Топ клиентов</h2>${clients_.length ? `<table class="top"><tr><th>Клиент</th><th class="n">Брони</th><th class="n">Часы</th><th class="n">Сумма</th></tr>
        ${clients_.slice(0, 10).map((c) => `<tr><td>${clientOf(c.phone)?.regular ? "★ " : ""}${esc(c.name)}<div class="muted" style="font-size:11px">${esc(c.phone || "")}</div></td><td class="n">${c.n}</td><td class="n">${c.h}</td><td class="n"><b>${money(c.v)}</b></td></tr>`).join("")}</table>` : '<p class="muted">Нет данных</p>'}</div>
    </div>`;
  $$("[data-p]").forEach((b) => b.onclick = () => { fin.preset = b.dataset.p; if (fin.preset === "custom") { fin.from = from; fin.to = to; } financeView(); });
  $$("[data-l]").forEach((b) => b.onclick = () => { fin.loc = b.dataset.l; financeView(); });
  const ff = $("#ff"), ft = $("#ft");
  if (ff) ff.onchange = ft.onchange = () => { if (ff.value && ft.value) { fin.from = ff.value; fin.to = ft.value; financeView(); } };
}

// ---------- Скидки ----------
function discountsView() {
  const list = structuredClone(cfg.discounts || []);
  const DN = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"], DV = [1, 2, 3, 4, 5, 6, 0];
  const fields = cfg.fields.filter((f) => f.active !== false);
  const fmtD = (d) => d ? `${d.slice(8)}.${d.slice(5, 7)}` : "";
  const desc = (d) => [
    d.dateFrom || d.dateTo ? (d.dateFrom === d.dateTo ? fmtD(d.dateFrom) : `${fmtD(d.dateFrom) || "…"}–${fmtD(d.dateTo) || "…"}`) : "",
    d.days?.length ? DV.filter((x) => d.days.includes(x)).map((x) => DN[DV.indexOf(x)]).join(", ") : (d.dateFrom || d.dateTo ? "" : "каждый день"),
    `${hourLabel(d.from)}–${hourLabel(d.to)}`,
    d.fields?.length ? fields.filter((f) => d.fields.includes(f.id)).map((f) => locName(f.locationId) + " " + f.name).join(", ") : "все поля",
  ].filter(Boolean).join(" · ");
  const save = async () => {
    try { const r = await api("POST", "/admin/discounts", { body: { discounts: list } }); cfg.discounts = r.discounts; toast("Скидки сохранены"); discountsView(); }
    catch (e) { toast(e.message, true); }
  };
  $("#app").innerHTML = `<h2>Скидки</h2>
    <p class="muted" style="font-size:13px">Клиент видит скидку на сайте: зачёркнутую цену, метку −% на часах и на днях. Если на час подходят несколько скидок — действует самая большая.</p>
    <div class="card list">${list.length ? list.map((d, i) => `<div class="item">
      <input type="checkbox" data-act="${i}" ${d.active !== false ? "checked" : ""} title="Включена">
      <div class="grow"><b>−${d.percent}% · ${esc(d.title)}</b><div class="muted" style="font-size:12px">${esc(desc(d))}</div></div>
      <button class="btn small" data-ed="${i}">Изменить</button>
      <button class="btn small danger" data-del="${i}">Удалить</button></div>`).join("") : '<p class="empty">Скидок пока нет</p>'}</div>
    <button class="btn main block" style="margin-top:12px" id="addd">+ Добавить скидку</button>`;
  $$("[data-act]").forEach((x) => x.onchange = () => { list[+x.dataset.act].active = x.checked; save(); });
  $$("[data-del]").forEach((x) => x.onclick = () => { if (!confirmInline(x)) return; list.splice(+x.dataset.del, 1); save(); });
  $$("[data-ed]").forEach((x) => x.onclick = () => edit(+x.dataset.ed));
  $("#addd").onclick = () => edit(-1);

  function edit(i) {
    const d = i >= 0 ? list[i] : { title: "", percent: 20, dateFrom: "", dateTo: "", days: [], from: cfg.open, to: Math.min(cfg.open + 4, cfg.close), fields: [], active: true };
    const days = new Set(d.days || []), fs = new Set(d.fields || []);
    modal(`<form id="df"><h3>${i >= 0 ? "Скидка" : "Новая скидка"}</h3>
      <div class="two"><label class="f">Название (видит клиент)<input name="title" required value="${esc(d.title)}" placeholder="Утро будни"></label>
      <label class="f">Скидка, %<input name="percent" type="number" min="1" max="90" required value="${d.percent}"></label></div>
      <div class="two"><label class="f">С даты (необязательно)<input name="dateFrom" type="date" value="${d.dateFrom || ""}"></label>
      <label class="f">По дату (необязательно)<input name="dateTo" type="date" value="${d.dateTo || ""}"></label></div>
      <div class="f" style="font-size:13px;color:var(--muted)">Дни недели (не выбрано — все дни)<div class="hrs" id="dd">${DV.map((v, k) => `<button type="button" data-v="${v}" class="${days.has(v) ? "on" : ""}">${DN[k]}</button>`).join("")}</div></div>
      <div class="two"><label class="f">С часа<select name="from">${Array.from({ length: cfg.close - cfg.open }, (_, k) => cfg.open + k).map((h) => `<option value="${h}" ${h === +d.from ? "selected" : ""}>${hourLabel(h)}</option>`).join("")}</select></label>
      <label class="f">До часа<select name="to">${Array.from({ length: cfg.close - cfg.open }, (_, k) => cfg.open + k + 1).map((h) => `<option value="${h}" ${h === +d.to ? "selected" : ""}>${hourLabel(h)}</option>`).join("")}</select></label></div>
      ${fields.length > 1 ? `<div class="f" style="font-size:13px;color:var(--muted)">Поля (не выбрано — все)<div class="hrs" id="ff">${fields.map((f) => `<button type="button" data-v="${f.id}" class="${fs.has(f.id) ? "on" : ""}">${esc(locName(f.locationId))} · ${esc(f.name)}</button>`).join("")}</div></div>` : ""}
      <button class="btn main block" style="margin-top:8px">Сохранить</button>
      <button type="button" class="btn block" style="margin-top:8px" id="cx">Отмена</button></form>`);
    $$("#dd button").forEach((b) => b.onclick = () => { const v = +b.dataset.v; days.has(v) ? days.delete(v) : days.add(v); b.classList.toggle("on"); });
    $$("#ff button").forEach((b) => b.onclick = () => { const v = b.dataset.v; fs.has(v) ? fs.delete(v) : fs.add(v); b.classList.toggle("on"); });
    $("#cx").onclick = closeModal;
    $("#df").onsubmit = (e) => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      if (+fd.to <= +fd.from) return toast("«До часа» должно быть позже «С часа»", true);
      if (fd.dateFrom && fd.dateTo && fd.dateTo < fd.dateFrom) return toast("Дата окончания раньше начала", true);
      const nd = { ...d, ...fd, percent: +fd.percent, from: +fd.from, to: +fd.to, days: [...days], fields: [...fs] };
      if (i >= 0) list[i] = nd; else list.push(nd);
      closeModal(); save();
    };
  }
}

// ---------- Настройки ----------
function settingsView() {
  const c = structuredClone(cfg);
  const lRow = (l, i) => `<tr data-li="${i}">
    <td><input data-k="name" value="${esc(l.name)}"></td>
    <td><input data-k="address" value="${esc(l.address)}"></td>
    <td><input data-k="map" value="${esc(l.map)}" placeholder="https://2gis.kz/…"></td></tr>`;
  const fRow = (f, i) => `<tr data-i="${i}">
    <td><select data-k="locationId" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)">${c.locations.map((l) => `<option value="${l.id}" ${l.id === f.locationId ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></td>
    <td><input data-k="name" value="${esc(f.name)}"></td>
    <td><input data-k="note" value="${esc(f.note || "")}" placeholder="7×7, крытое…"></td>
    <td><input data-k="priceDay" type="number" step="500" value="${f.priceDay}"></td>
    <td><input data-k="eveningFrom" type="number" min="0" max="28" value="${f.eveningFrom}" style="width:64px"></td>
    <td><input data-k="priceEvening" type="number" step="500" value="${f.priceEvening}"></td>
    <td><input data-k="priceWeekend" type="number" step="500" value="${f.priceWeekend}"></td>
    <td style="text-align:center"><input data-k="active" type="checkbox" ${f.active !== false ? "checked" : ""}></td></tr>`;
  $("#app").innerHTML = `<form id="sf">
    <h2>Арена</h2><div class="card">
      <div class="two"><label class="f">Название<input name="name" value="${esc(c.name)}"></label><label class="f">Телефон для клиентов<input name="phone" value="${esc(c.phone)}"></label></div>

      <div class="two"><label class="f">Открытие (час)<input name="open" type="number" min="0" max="23" value="${c.open}"></label>
      <label class="f">Закрытие (час, 24 = полночь, 26 = 02:00)<input name="close" type="number" min="1" max="28" value="${c.close}"></label></div>
      <label class="f">Бронирование открыто на, дней вперёд<input name="daysAhead" type="number" min="1" max="90" value="${c.daysAhead}"></label>
    </div>
    <h2>Адреса</h2><div class="card" style="overflow-x:auto">
      <table class="fields"><thead><tr><th>Название</th><th>Адрес</th><th>Ссылка 2ГИС</th></tr></thead>
      <tbody id="lb">${c.locations.map(lRow).join("")}</tbody></table>
      <p class="muted" style="font-size:12px;margin-bottom:0">Новый адрес добавьте здесь и сохраните — потом его можно выбрать у поля.</p>
      <button type="button" class="btn small" id="addl" style="margin-top:10px">+ Добавить адрес</button>
    </div>
    <h2>Поля и цены за час, ₸</h2><div class="card" style="overflow-x:auto">
      <table class="fields"><thead><tr><th>Адрес</th><th>Название</th><th>Описание</th><th>День</th><th>Вечер с</th><th>Вечер</th><th>Сб–Вс</th><th>Вкл</th></tr></thead>
      <tbody id="fb">${c.fields.map(fRow).join("")}</tbody></table>
      <button type="button" class="btn small" id="addf" style="margin-top:10px">+ Добавить поле</button>
      <p class="muted" style="font-size:12px;margin-bottom:0">Цена «Сб–Вс» действует весь день в выходные. Если оставить 0 — в выходные работают дневная и вечерняя цены.</p>
    </div>
    <h2>Предоплата</h2><div class="card">
      <div class="two"><label class="f">Предоплата, % (0 — бронь без предоплаты)<input name="prepayPercent" type="number" min="0" max="100" value="${c.prepayPercent}"></label>
      <label class="f">Сколько минут держать слот на оплату<input name="holdMinutes" type="number" min="5" max="120" value="${c.holdMinutes}"></label></div>
      <label class="f">Ссылка Kaspi Pay / Kaspi QR (кнопка «Оплатить в Kaspi»)<input name="kaspiLink" value="${esc(c.kaspiLink)}" placeholder="https://pay.kaspi.kz/pay/…"></label>
      <div class="two"><label class="f">Номер для перевода<input name="kaspiPhone" value="${esc(c.kaspiPhone)}"></label>
      <label class="f">Получатель (видит клиент при оплате)<input name="kaspiName" value="${esc(c.kaspiName)}"></label></div>
    </div>
    <button class="btn main block" style="margin-top:16px" id="ss">Сохранить настройки</button></form>`;
  $("#addf").onclick = () => {
    c.fields.push({ id: "", locationId: c.locations[0].id, name: "Поле " + (c.fields.length + 1), note: "", priceDay: 10000, priceEvening: 14000, eveningFrom: 18, priceWeekend: 0, active: true });
    $("#fb").insertAdjacentHTML("beforeend", fRow(c.fields.at(-1), c.fields.length - 1));
  };
  $("#addl").onclick = () => {
    c.locations.push({ id: "", name: "Новый адрес", address: "", map: "" });
    $("#lb").insertAdjacentHTML("beforeend", lRow(c.locations.at(-1), c.locations.length - 1));
  };
  $("#sf").onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    $$("#lb tr").forEach((tr) => {
      const l = c.locations[+tr.dataset.li];
      tr.querySelectorAll("input").forEach((inp) => (l[inp.dataset.k] = inp.value));
    });
    $$("#fb tr").forEach((tr) => {
      const f = c.fields[+tr.dataset.i];
      tr.querySelectorAll("input,select").forEach((inp) => (f[inp.dataset.k] = inp.type === "checkbox" ? inp.checked : inp.value));
    });
    try {
      const r = await api("POST", "/admin/config", { body: { config: { ...c, ...fd, fields: c.fields } } });
      cfg = { ...cfg, ...r.config };
      $("#title").innerHTML = esc(cfg.name).replace(/^(.*?)(\s+)(\S+)$/, "$1$2<em>$3</em>");
      toast("Настройки сохранены");
      settingsView();
    } catch (err) { toast(err.message, true); }
  };
}

start().catch((e) => ($("#app").innerHTML = `<p class="empty">Ошибка: ${esc(e.message)}</p>`));
</script>
</body>
</html>
