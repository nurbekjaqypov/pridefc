<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRIDE FC — бронирование футбольных полей</title>
<meta name="description" content="Онлайн-бронирование футбольных полей PRIDE FC в Алматы — Жарокова и Мамыр-1. Выберите время, внесите предоплату через Kaspi.">
<meta name="theme-color" content="#03110a">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRIDE FC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="demo"></div>
<header class="top"><div class="wrap">
  <div class="brand">
    <div class="logo"><img src="icons/icon-192.png" alt=""></div>
    <div><h1 id="title">PRIDE <em>FC</em></h1><p id="sub">Бронирование полей онлайн</p></div>
  </div>
</div></header>

<main class="wrap" id="app"><p class="empty">Загрузка…</p></main>
<div class="bar" id="bar" hidden><div class="in">
  <div class="sum" id="sum"></div>
  <button class="btn main" id="go">Забронировать</button>
</div></div>
<div id="modal"></div>

<script type="module">
import { call, isDemo, saveLocal, loadLocal, dropLocal } from "./api.js";
import { addDays, weekday, hourLabel, rangeLabel, money, promosForDay } from "./core.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const dateLong = (d) => `${+d.slice(8)} ${MON[+d.slice(5, 7) - 1]}, ${WD[weekday(d)].toLowerCase()}`;

let cfg, day, date, fieldId, loc, sel = new Set(), pollTimer, tickTimer;

function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " err" : "");
  t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}

async function init() {
  if (await isDemo()) $("#demo").innerHTML = '<div class="demo">Демо-режим: брони сохраняются только в этом браузере. <a href="admin.html">Админка →</a> (пароль: demo)</div>';
  cfg = await call("GET", "/config");
  $("#title").innerHTML = esc(cfg.name).replace(/^(.*?)(\s+)(\S+)$/, "$1$2<em>$3</em>");
  $("#sub").innerHTML = ["Футбольные поля · Алматы", cfg.phone ? `<a href="tel:${esc(cfg.phone.replace(/[^\d+]/g, ""))}">${esc(cfg.phone)}</a>` : ""].filter(Boolean).join(" · ");
  document.title = cfg.name + " — бронирование";
  const mine = loadLocal("current");
  date = cfg.today;
  loc = cfg.locations.some((l) => l.id === loadLocal("loc")) ? loadLocal("loc") : cfg.locations[0]?.id;
  if (mine) return showBooking(mine.date, mine.id);
  await loadDay();
}
function pitchSVG() {
  let st = "";
  for (let i = 0; i < 10; i++) st += `<rect x="${i * 16}" y="0" width="16" height="104" fill="${i % 2 ? "#23983f" : "#1d8a37"}"/>`;
  const L = 'fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.3"';
  return `<svg viewBox="0 0 160 104" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${st}
    <rect x="7" y="7" width="146" height="90" ${L}/><line x1="80" y1="7" x2="80" y2="97" ${L}/>
    <circle cx="80" cy="52" r="13" ${L}/><circle cx="80" cy="52" r="1.6" fill="#fff"/>
    <rect x="7" y="30" width="22" height="44" ${L}/><rect x="131" y="30" width="22" height="44" ${L}/>
    <rect x="7" y="42" width="8" height="20" ${L}/><rect x="145" y="42" width="8" height="20" ${L}/>
    <rect x="3" y="46" width="4" height="12" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="1"/>
    <rect x="153" y="46" width="4" height="12" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="1"/>
    <path d="M29 44 a10 10 0 0 1 0 16 M131 44 a10 10 0 0 0 0 16" ${L}/></svg>`;
}
const locFields = () => day.fields.filter((f) => f.locationId === loc);
const mapLink = (l) => l?.map ? `<a class="map" href="${esc(l.map)}" target="_blank" rel="noopener">📍 2ГИС</a>` : "";

async function loadDay() {
  day = await call("GET", "/day", { query: { date } });
  if (!locFields().find((f) => f.id === fieldId)) fieldId = locFields()[0]?.id;
  render();
}

function render() {
  const days = [];
  for (let i = 0; i <= cfg.daysAhead; i++) {
    const d = addDays(cfg.today, i);
    const top = i === 0 ? "Сегодня" : i === 1 ? "Завтра" : WD[weekday(d)];
    const lf = cfg.fields.filter((x) => x.locationId === loc).map((x) => x.id);
    const best = Math.max(0, ...promosForDay(cfg, d).filter((p) => !p.fields?.length || p.fields.some((id) => lf.includes(id))).map((x) => x.percent));
    days.push(`<button class="day ${d === date ? "on" : ""}" data-d="${d}"><span>${top}</span><b>${+d.slice(8)}</b><span>${MON[+d.slice(5, 7) - 1]}</span>${best ? `<i class="dtag">−${best}%</i>` : ""}</button>`);
  }
  const f = locFields().find((x) => x.id === fieldId);
  const locs = cfg.locations.length > 1
    ? `<div class="locs">${cfg.locations.map((l) => `<div class="loc ${l.id === loc ? "on" : ""}" data-l="${l.id}">
        <div class="grow"><b>${esc(l.name)}</b><span>${esc(l.address)}</span></div>${mapLink(l)}</div>`).join("")}</div>`
    : `<div class="loc on"><div class="grow"><b>${esc(cfg.locations[0]?.name || "")}</b><span>${esc(cfg.locations[0]?.address || "")}</span></div>${mapLink(cfg.locations[0])}</div>`;
  const lf = locFields();
  const pitches = lf.length
    ? `<div class="pitches" style="--n:${Math.min(lf.length, 3)}">${lf.map((x) => {
        const fr = x.slots.filter((s) => s.state === "free").length;
        return `<button class="pitch ${x.id === fieldId ? "on" : ""}" data-f="${x.id}" aria-label="${esc(x.name)}">${pitchSVG()}
          <div class="pl"><b>${esc(x.name)}</b><span>${x.note ? esc(x.note) + " · " : ""}${fr ? `свободно ${fr} ч` : "мест нет"}</span></div></button>`;
      }).join("")}</div>`
    : '<p class="empty">Нет доступных полей</p>';
  const free = f ? f.slots.filter((s) => s.state === "free").length : 0;
  const promos = (day.promos || []).filter((p) => !p.fields?.length || p.fields.includes(fieldId));
  $("#app").innerHTML = `<div class="dash">
    <section class="panel a-loc"><h2>Адрес</h2>${locs}</section>
    <section class="panel a-pitch"><h2>Поле</h2>${pitches}</section>
    <section class="panel a-time">
      <h2>Дата</h2><div class="days">${days.join("")}</div>
      ${promos.length ? `<div class="promo">🔥 ${promos.map((p) => `<span><b>−${p.percent}%</b> ${esc(p.title)} · ${hourLabel(p.from)}–${hourLabel(p.to)}</span>`).join("")}</div>` : ""}
      <h2 class="h2b">Время · ${dateLong(date)}</h2>
      ${f && free === 0 ? '<p class="empty">На этот день свободного времени нет — выберите другую дату</p>' : ""}
      <div class="slots">${(f?.slots || []).map((s) => `
        <button class="slot ${s.state} ${sel.has(s.h) ? "on" : ""}" data-h="${s.h}" ${s.state !== "free" ? "disabled" : ""}>
          ${s.pct && s.state === "free" ? `<i class="stag">−${s.pct}%</i>` : ""}
          <b>${hourLabel(s.h)}</b><span>${s.pct ? `<s>${money(s.base)}</s> ` : ""}${money(s.price)}</span>
        </button>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin:16px 0 0">Можно выбрать несколько часов подряд. ${cfg.prepayPercent ? `Для брони нужна предоплата ${cfg.prepayPercent}% через Kaspi, остаток — на месте.` : ""}</p>
    </section></div>`;
  document.querySelectorAll(".day").forEach((b) => b.onclick = () => { date = b.dataset.d; sel.clear(); loadDay(); });
  document.querySelectorAll(".loc").forEach((b) => b.onclick = (e) => {
    if (e.target.closest(".map")) return;
    loc = b.dataset.l; saveLocal("loc", loc); fieldId = locFields()[0]?.id; sel.clear(); render();
  });
  document.querySelectorAll(".pitch").forEach((b) => b.onclick = () => { fieldId = b.dataset.f; sel.clear(); render(); });
  document.querySelectorAll(".slot.free").forEach((b) => b.onclick = () => {
    const h = +b.dataset.h;
    sel.has(h) ? sel.delete(h) : sel.add(h);
    render();
  });
  const dd = $(".days"), on = $(".day.on");
  if (dd && on) dd.scrollLeft = on.offsetLeft - dd.clientWidth / 2 + on.offsetWidth / 2;
  requestAnimationFrame(() => document.body.classList.add("ready"));
  renderBar();
}

function totals() {
  const f = locFields().find((x) => x.id === fieldId);
  const total = [...sel].reduce((s, h) => s + (f.slots.find((x) => x.h === h)?.price || 0), 0);
  const base = [...sel].reduce((s, h) => s + (f.slots.find((x) => x.h === h)?.base || 0), 0);
  return { total, save: base - total, prepay: Math.round((total * (cfg.prepayPercent || 0)) / 100) };
}

function renderBar() {
  if (!sel.size) { $("#bar").hidden = true; return; }
  const { total, prepay, save } = totals();
  $("#bar").hidden = false;
  $("#sum").innerHTML = `${rangeLabel(sel)} · ${sel.size} ч<b>${money(total)}${save ? ` <small style="color:var(--accent);font-size:12px">скидка ${money(save)}</small>` : ""}</b>${prepay ? `предоплата ${money(prepay)}` : ""}`;
  $("#go").onclick = openForm;
}

function openForm() {
  const f = locFields().find((x) => x.id === fieldId);
  const l = cfg.locations.find((x) => x.id === loc);
  const { total, prepay } = totals();
  const me = loadLocal("me") || {};
  $("#modal").innerHTML = `<div class="modal-bg"><form class="modal" id="form">
    <h3>Бронирование</h3>
    <div class="card" style="margin-bottom:16px;padding:14px">
      <div class="row"><div class="grow"><b>${esc(l?.name || "")} · ${esc(f.name)}</b><div class="muted" style="font-size:13px">${dateLong(date)} · ${rangeLabel(sel)}</div></div>
      <div style="text-align:right"><b>${money(total)}</b>${prepay ? `<div class="muted" style="font-size:13px">предоплата ${money(prepay)}</div>` : ""}</div></div>
    </div>
    <label class="f">Ваше имя<input name="name" required minlength="2" autocomplete="name" value="${esc(me.name || "")}"></label>
    <label class="f">Телефон (WhatsApp)<input name="phone" required type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __" value="${esc(me.phone || "")}"></label>
    <button class="btn main block" id="submit">${prepay ? "Перейти к оплате" : "Забронировать"}</button>
    <button type="button" class="btn block" style="margin-top:8px" id="close">Отмена</button>
  </form></div>`;
  $("#close").onclick = () => ($("#modal").innerHTML = "");
  $("#form").onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    $("#submit").disabled = true;
    try {
      const { booking } = await call("POST", "/book", { body: { date, fieldId, hours: [...sel], name: fd.name, phone: fd.phone } });
      saveLocal("me", { name: fd.name, phone: fd.phone });
      saveLocal("current", { date: booking.date, id: booking.id });
      $("#modal").innerHTML = "";
      sel.clear();
      $("#bar").hidden = true;
      showBooking(booking.date, booking.id, booking);
    } catch (err) {
      toast(err.message, true);
      $("#submit").disabled = false;
      if (err.status === 409) { $("#modal").innerHTML = ""; sel.clear(); loadDay(); }
    }
  };
}

async function showBooking(d, id, b) {
  clearInterval(pollTimer); clearInterval(tickTimer);
  try { b = b || (await call("GET", "/booking", { query: { date: d, id } })).booking; }
  catch { dropLocal("current"); date = cfg.today; loc = loc || cfg.locations[0]?.id; return loadDay(); }
  $("#bar").hidden = true;
  const bl = cfg.locations.find((x) => x.id === b.locationId);

  const head = `<h2>Ваша бронь</h2><div class="card">
    <div class="row"><div class="grow"><b style="font-size:18px">${esc(b.locationName ? b.locationName + " · " : "")}${esc(b.fieldName)}</b>
    <div class="muted">${dateLong(b.date)} · ${rangeLabel(b.hours)}</div>
    ${bl ? `<div class="muted" style="font-size:13px;margin-top:4px">${esc(bl.address)} ${mapLink(bl)}</div>` : ""}</div>
    <div style="text-align:right"><b>${money(b.total)}</b>${b.prepay ? `<div class="muted" style="font-size:13px">предоплата ${money(b.prepay)}</div>` : ""}</div></div></div>`;
  const again = `<button class="btn block" style="margin-top:12px" id="again">Забронировать ещё</button>`;
  let body = "";

  const checksHtml = "";
  const uploader = `<label class="btn main block upl" id="upl">📎 ${b.receipt ? "Прикрепить другой чек" : "Прикрепить чек"}<input type="file" id="file" accept="application/pdf,image/*" hidden></label>
      <p class="muted" style="font-size:12px;margin:8px 0 0">В Kaspi откройте перевод → «Поделиться» → PDF. Или прикрепите скриншот чека.</p>`;
  if (b.status === "hold" && !b.expired) {
    const kaspi = cfg.kaspiLink
      ? `<a class="btn block" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${esc(cfg.kaspiLink)}" target="_blank" rel="noopener">Оплатить в Kaspi</a>`
      : "";
    body = `<div class="card" style="margin-top:12px">
      <div class="muted" style="font-size:13px">К оплате сейчас</div>
      <div class="big">${money(b.prepay)}</div>
      <div class="muted" style="font-size:13px">Время держим за вами ещё <b id="left" style="color:var(--warn)"></b></div>
      <ol class="steps">
        <li>Переведите предоплату через Kaspi${cfg.kaspiPhone ? ` на номер <b class="copy" data-copy="${esc(cfg.kaspiPhone)}">${esc(cfg.kaspiPhone)}</b>` : ""}${cfg.kaspiName ? ` (${esc(cfg.kaspiName)})` : ""}.${kaspi}</li>
        <li>Прикрепите чек — бронь подтвердится сразу.</li>
      </ol>
      ${checksHtml}${uploader}
    </div>`;
  } else if (b.status === "hold" && b.expired) {
    body = `<div class="card" style="margin-top:12px"><span class="pill expired">Время на оплату вышло</span>
      <p>Если вы уже перевели деньги — прикрепите чек, и бронь сохранится, если время ещё свободно.</p>${checksHtml}${uploader}</div>`;
  } else if (b.status === "claimed") {
    body = `<div class="card" style="margin-top:12px"><span class="pill claimed">Проверяем оплату</span>
      <p>Администратор проверит перевод и подтвердит бронь. Страница обновится сама.</p></div>`;
  } else if (["paid", "prelim", "unpaid", "done"].includes(b.status)) {
    body = `<div class="card" style="margin-top:12px"><span class="pill paid">Бронь подтверждена ✓</span>
      <p>Ждём вас ${dateLong(b.date)} в ${hourLabel(b.hours[0])}. ${b.total - (["paid", "prelim"].includes(b.status) ? b.prepay : 0) > 0 ? `Остаток ${money(b.total - (["paid", "prelim"].includes(b.status) ? b.prepay : 0))} — на месте.` : ""}</p>
      </div>`;
  } else if (b.status === "cancelled") {
    body = `<div class="card" style="margin-top:12px"><span class="pill cancelled">Бронь отменена</span>
      <p>Если это ошибка — позвоните нам${cfg.phone ? `: <a href="tel:${esc(cfg.phone.replace(/[^\d+]/g, ""))}">${esc(cfg.phone)}</a>` : ""}.</p></div>`;
  }
  $("#app").innerHTML = `<div class="narrow">${head + body + again}</div>`;

  document.querySelectorAll(".copy").forEach((el) => el.onclick = () => {
    navigator.clipboard?.writeText(el.dataset.copy).then(() => toast("Номер скопирован"), () => {});
  });
  $("#again").onclick = () => { clearInterval(pollTimer); clearInterval(tickTimer); dropLocal("current"); date = cfg.today; loadDay(); };
  const claim = $("#claim");
  if (claim) claim.onclick = async () => {
    claim.disabled = true;
    try { const r = await call("POST", "/claim", { body: { date: b.date, id: b.id } }); showBooking(b.date, b.id, r.booking); }
    catch (e) { toast(e.message, true); claim.disabled = false; }
  };
  const file = $("#file");
  if (file) file.onchange = async () => {
    const f = file.files[0];
    if (!f) return;
    $("#upl").innerHTML = '<span class="spin"></span> Отправляем чек…';
    $("#upl").style.pointerEvents = "none";
    try {
      const { type, b64 } = await readReceipt(f);
      const r = await call("POST", "/receipt", { body: { date: b.date, id: b.id, type, b64 } });
      showBooking(b.date, b.id, r.booking);
    } catch (e) { toast(e.message, true); showBooking(b.date, b.id); }
  };
  if (b.status === "hold" && !b.expired) {
    const tick = () => {
      const s = Math.max(0, Math.round((b.exp - Date.now()) / 1000));
      const el = $("#left"); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      if (s <= 0) showBooking(b.date, b.id);
    };
    tick(); tickTimer = setInterval(tick, 1000);
  }
  if (b.status === "claimed") pollTimer = setInterval(() => showBooking(b.date, b.id), 10000);
  if (["paid", "unpaid", "cancelled", "done"].includes(b.status) && b.date < cfg.today) dropLocal("current");
}

// Фото ужимаем до ~1600px JPEG, PDF отправляем как есть
async function readReceipt(f) {
  const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
  if (f.type === "application/pdf") {
    if (f.size > 4e6) throw new Error("PDF больше 4 МБ — прикрепите скриншот");
    return { type: f.type, b64: await toB64(f) };
  }
  if (!f.type.startsWith("image/")) throw new Error("Нужен PDF или изображение");
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Не удалось открыть изображение")); i.src = URL.createObjectURL(f); });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
  return { type: "image/jpeg", b64: await toB64(blob) };
}

init().catch((e) => ($("#app").innerHTML = `<p class="empty">Не удалось загрузить: ${esc(e.message)}</p>`));
</script>
</body>
</html>
